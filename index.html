<html lang="es">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Yendo - Pago real</title>

  <style>

    body {

      font-family: Arial, sans-serif;

      background: #f4f6f8;

      margin: 0;

      text-align: center;

    }

    header {

      background: #00c853;

      color: white;

      padding: 18px;

      font-size: 28px;

      font-weight: bold;

    }

    .container {

      max-width: 700px;

      margin: 30px auto;

      padding: 20px;

    }

    .subtitle {

      color: #555;

      margin-bottom: 20px;

      font-size: 20px;

    }

    .buttons {

      margin-bottom: 25px;

    }

    button {

      padding: 12px 18px;

      margin: 8px;

      border: none;

      background: #00c853;

      color: white;

      border-radius: 20px;

      font-size: 15px;

      cursor: pointer;

      box-shadow: 0 3px 8px rgba(0,0,0,0.15);

    }

    button:hover {

      background: #009624;

    }

    .card {

      background: white;

      border-radius: 14px;

      padding: 20px;

      box-shadow: 0 3px 12px rgba(0,0,0,0.10);

    }

    #lista {

      margin-top: 10px;

      color: #333;

      line-height: 1.8;

    }

    #total {

      margin-top: 16px;

      font-size: 20px;

      font-weight: bold;

      color: #00c853;

    }

    #pagarBtn {

      background: #009ee3;

    }

    #pagarBtn:hover {

      background: #0077ad;

    }

    #estado {

      margin-top: 18px;

      font-weight: bold;

      color: #444;

    }

  </style>

</head>

<body>

  <header>Yendo 🛵</header>

  <div class="container">

    <div class="subtitle">Elegí productos y pagá con Mercado Pago</div>

    <div class="buttons">

      <button onclick="agregar('Carnicería', 300)">Carnicería $300</button>

      <button onclick="agregar('Farmacia', 200)">Farmacia $200</button>

      <button onclick="agregar('Pollería', 250)">Pollería $250</button>

      <button onclick="agregar('Almacén', 150)">Almacén $150</button>

    </div>

    <div class="card">

      <h3>Carrito</h3>

      <div id="lista">Vacío</div>

      <div id="total"></div>

      <button id="pagarBtn" onclick="pagar()">Pagar con Mercado Pago</button>

      <div id="estado"></div>

    </div>

  </div>

  <script>

    let carrito = [];

    function agregar(nombre, precio) {

      carrito.push({ nombre, precio });

      render();

    }

    function render() {

      const lista = document.getElementById("lista");

      const totalEl = document.getElementById("total");

      if (carrito.length === 0) {

        lista.innerHTML = "Vacío";

        totalEl.innerHTML = "";

        return;

      }

      let html = "";

      let total = 0;

      carrito.forEach((p) => {

        html += ${p.nombre} - $${p.precio}<br>;

        total += p.precio;

      });

      lista.innerHTML = html;

      totalEl.innerHTML = Total: $${total};

    }

    async function pagar() {

      const estado = document.getElementById("estado");

      if (carrito.length === 0) {

        alert("El carrito está vacío");

        return;

      }

      estado.textContent = "Creando pago...";

      try {

        const respuesta = await fetch("/crear-preferencia", {

          method: "POST",

          headers: {

            "Content-Type": "application/json"

          },

          body: JSON.stringify({ items: carrito })

        });

        const data = await respuesta.json();

        if (!respuesta.ok) {

          throw new Error(data.error || "No se pudo crear el pago");

        }

        estado.textContent = "Redirigiendo a Mercado Pago...";

        window.location.href = data.init_point;

      } catch (error) {

        estado.textContent = "Error: " + error.message;

      }

    }

    render();

  </script>

</body>

</html>
