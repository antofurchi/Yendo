<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <title>Yendo</title>

  <style>

    body {

      font-family: Arial;

      text-align: center;

      background: #f4f4f4;

    }

    h1 {

      color: green;

    }

    button {

      margin: 5px;

      padding: 10px;

      border: none;

      background: green;

      color: white;

      border-radius: 5px;

      cursor: pointer;

    }

    .box {

      background: white;

      padding: 15px;

      margin: 20px auto;

      width: 300px;

      border-radius: 10px;

    }

  </style>

</head>

<body>

<h1>Yendo 🛵</h1>

<p>Elegí un comercio</p>

<button onclick="cargar('carniceria')">Carnicería</button>

<button onclick="cargar('farmacia')">Farmacia</button>

<button onclick="cargar('almacen')">Almacén</button>

<div class="box">

  <h3>Productos</h3>

  <div id="productos"></div>

</div>

<div class="box">

  <h3>Carrito</h3>

  <div id="carrito">Vacío</div>

  <p id="total"></p>

  <button onclick="pagar()">Pagar</button>

</div>

<script>

let carrito = [];

let productos = {

  carniceria: [

    { nombre: "Carne", precio: 200 },

    { nombre: "Pollo", precio: 150 }

  ],

  farmacia: [

    { nombre: "Ibuprofeno", precio: 100 },

    { nombre: "Alcohol", precio: 80 }

  ],

  almacen: [

    { nombre: "Pan", precio: 50 },

    { nombre: "Leche", precio: 60 }

  ]

};

function cargar(tipo) {

  let html = "";

  productos[tipo].forEach(p => {

    html += <button onclick="agregar('${p.nombre}', ${p.precio})">${p.nombre} - $${p.precio}</button>;

  });

  document.getElementById("productos").innerHTML = html;

}

function agregar(nombre, precio) {

  carrito.push({ nombre, precio });

  render();

}

function render() {

  let html = "";

  let total = 0;

  carrito.forEach(p => {

    html += p.nombre + " - $" + p.precio + "<br>";

    total += p.precio;

  });

  document.getElementById("carrito").innerHTML = html;

  document.getElementById("total").innerText = "Total: $" + total;

}

function pagar() {

  alert("Pago listo 🚀 (simulado)");

}

</script>

</body>

</html>
