[5:53, 23/4/2026] Antonella Furchi: <!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yendo - Delivery local</title>

<link rel="manifest" href="manifest.json">

<style>

body {

  font-family: Arial;

  margin: 0;

  background: #f5f5f5;

}

header {

  background: #27c2a0;

  color: white;

  padding: 15px;

  text-align: center;

  font-size: 22px;

  font-weight: bold;

}

.container {

  padding: 20px;

}

.card {

  background: white;

  padding: 15px;

  border-radius: 12px;

  margin-bottom: 15px;

}

button {

  background: #27c2a0;

  color: white;

  border: none;

  padding: 10px;

  border-radius: 8px;

  cursor: pointer;

}

.pay {

  background: #2196f3;

  width: 100%;

  margin-top: 10px;

}

.total {

  font-size: 20px;

  font-weight: bold;

}

</style>

</head>

<body>

<header>Yendo 🚴</header>

<div class="container">

  <h2>Comercios</h2>

  <div class="card">

    🥩 Carnicería - $200

    <br><br>

    <button onclick="agregar('Carnicería',200)">Agregar</button>

  </div>

  <div class="card">

    🍗 Pollería - $250

    <br><br>

    <button onclick="agregar('Pollería',250)">Agregar</button>

  </div>

  <div class="card">

    💊 Farmacia - $180

    <br><br>

    <button onclick="agregar('Farmacia',180)">Agregar</button>

  </div>

  <h2>Carrito</h2>

  <div id="carrito"></div>

  <div class="total">

    Total: $<span id="total">0</span>

  </div>

  <!-- BOTÓN DE PAGO REAL -->

  <a href="https://mpago.la/tu_link" target="_blank">

    <button class="pay">Pagar con MercadoPago</button>

  </a>

  <br><br>

  <button onclick="pedido()">Confirmar pedido</button>

  <p id="mensaje"></p>

</div>

<script>

let carrito = [];

function agregar(nombre, precio) {

  carrito.push({nombre, precio});

  render();

}

function render() {

  let html = "";

  let total = 0;

  carrito.forEach(p => {

    html += p.nombre + " - $" + p.precio + "<br>";

    total += p.precio;

  });

  document.getElementById("carrito").innerHTML = html;

  document.getElementById("total").innerText = total;

}

function pedido() {

  if(carrito.length === 0){

    alert("Agregá productos");

    return;

  }

  document.getElementById("mensaje").innerText = "Pedido enviado 🚀";

  carrito = [];

  render();

}

</script>

</body>

</html>
