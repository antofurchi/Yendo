<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yendo App</title>

<style>

body {

  font-family: Arial;

  background: #f5f5f5;

  text-align: center;

}

h1 {

  color: #00c853;

}

button {

  padding: 12px;

  margin: 8px;

  border: none;

  background: #00c853;

  color: white;

  border-radius: 8px;

  font-size: 16px;

  cursor: pointer;

}

button:hover {

  background: #009624;

}

#carrito {

  margin-top: 20px;

  padding: 15px;

  background: white;

  border-radius: 10px;

}

#total {

  font-weight: bold;

  margin-top: 10px;

}

</style>

</head>

<body>

<h1>Yendo 🛵</h1>

<h3>Elegí un comercio</h3>

<button onclick="agregar('Carnicería', 300)">Carnicería</button>

<button onclick="agregar('Farmacia', 200)">Farmacia</button>

<button onclick="agregar('Pollería', 250)">Pollería</button>

<button onclick="agregar('Almacén', 150)">Almacén</button>

<div id="carrito">

  <h3>Carrito</h3>

  <div id="lista"></div>

  <div id="total"></div>

</div>

<button onclick="pagar()">Pagar 💳</button>

<script>

let carrito = [];

function agregar(nombre, precio) {

  carrito.push({ nombre, precio });

  render();

}

function render() {

  let html = "";

  let total = 0;

  carrito.forEach(p => {

    html += p.nombre + " - $" + p.precio + "<br>";

    total += p.precio;

  });

  document.getElementById("lista").innerHTML = html;

  document.getElementById("total").innerHTML = "Total: $" + total;

}

function pagar() {

  if (carrito.length === 0) {

    alert("El carrito está vacío");

    return;

  }

  alert("Pedido realizado ✅");

  carrito = [];

  render();

}

</script>

</body>

</html>
