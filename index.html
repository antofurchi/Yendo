<!DOCTYPE html>

<html>

<head>

  <title>Yendo</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    body {

      margin: 0;

      font-family: Arial;

      background: #f5f5f5;

    }

    header {

      background: #ff3d3d;

      color: white;

      padding: 15px;

      font-size: 22px;

      font-weight: bold;

    }

    .container {

      padding: 15px;

    }

    .card {

      background: white;

      border-radius: 10px;

      padding: 15px;

      margin-bottom: 10px;

      box-shadow: 0 2px 5px rgba(0,0,0,0.1);

    }

    button {

      background: #ff3d3d;

      color: white;

      border: none;

      padding: 10px;

      border-radius: 8px;

      width: 100%;

      margin-top: 10px;

      font-size: 16px;

    }

  </style>

</head>

<body>

<header>

  Yendo 🚀

</header>

<div class="container">

  <div class="card">

    <h3>🍔 Hamburguesa</h3>

    <p>$250</p>

    <button>Agregar</button>

  </div>

  <div class="card">

    <h3>🍕 Pizza</h3>

    <p>$300</p>

    <button>Agregar</button>

  </div>

  <div class="card">

    <h3>🥤 Refresco</h3>

    <p>$120</p>

    <button>Agregar</button>

  </div>

</div>

</body>

</html>
